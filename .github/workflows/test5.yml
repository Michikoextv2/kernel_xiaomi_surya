# ==============================================================================
# Michiko Kernel - Automated Build Workflow
# Target    : Poco X3 NFC (surya/karna)
# Branch    : lineage-24.0
# Runner    : ubuntu-24.04
# Toolchain : FoxeClang v18.1.8 + FoxGCC ARM32 v17.0
# ==============================================================================

name: Supernova Kernel

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".github/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # JOB 0 — Kirim notifikasi awal ke Telegram (1 kali, bukan per variant)
  # ============================================================================
  notify-start:
    name: Notify Build Started
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      msg_id: ${{ steps.send.outputs.msg_id }}

    steps:
      - name: Send build started notification
        id: send
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: "-1003641667794"
          TG_THREAD_ID: "7279"
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="🔨 Supernova Kernel — Build Started

Device  : POCO X3 NFC (surya/karna)
Variant : NonKSU + KernelSU (parallel)
Trigger : ${{ github.event_name }}
Actions : ${RUN_URL}"

          RESP=$(curl -s -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "message_thread_id=${TG_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            --max-time 30)

          MSG_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['message_id'])" 2>/dev/null || echo "")
          echo "msg_id=${MSG_ID}" >> "$GITHUB_OUTPUT"
          echo "Sent message_id: ${MSG_ID}"

  # ============================================================================
  # JOB 1 — Compile kedua variant secara paralel (matrix)
  # ============================================================================
  build:
    name: Build Kernel [${{ matrix.variant }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: notify-start

    strategy:
      fail-fast: false
      matrix:
        variant: [NonKSU, KSU]

    outputs:
      date_tag:   ${{ steps.meta.outputs.date_tag }}
      short_sha:  ${{ steps.meta.outputs.short_sha }}

    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_HOST: xyz
      KBUILD_BUILD_USER: standalone
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_DIR: ${{ github.workspace }}/toolchain/clang
      GCC32_DIR: ${{ github.workspace }}/toolchain/gcc32
      AK3_DIR: ${{ github.workspace }}/AnyKernel3
      KERNEL_DIR: ${{ github.workspace }}/kernel-source
      KERNEL_NAME: Supernova
      TARGET_DEVICE: "POCO X3 NFC (surya/karna)"
      DEFCONFIG: surya_defconfig
      ENABLE_KERNELSU: ${{ matrix.variant == 'KSU' && 'true' || 'false' }}
      VARIANT_LABEL: ${{ matrix.variant }}

    steps:
      # --------------------------------------------------------------------
      # 0. Inject GH_PAT
      # --------------------------------------------------------------------
      - name: Configure git credentials
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GH_PAT }}@github.com" \
            > ~/.git-credentials
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf \
            "https://github.com/"

      # --------------------------------------------------------------------
      # 1. Checkout kernel source
      # --------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: FoxMiko-Labs/kernel_xiaomi_surya
          ref: rebase
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 5
          path: kernel-source

      # --------------------------------------------------------------------
      # 1.5. Implant NoMount
      # --------------------------------------------------------------------
      - name: Implant NoMount
        run: |
          cd "$KERNEL_DIR"
          curl -fsSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

      # --------------------------------------------------------------------
      # 1.6. Setup KernelSU
      # --------------------------------------------------------------------
      - name: Setup KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd "$KERNEL_DIR"
          curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main

      # --------------------------------------------------------------------
      # 2. Configure swap
      # --------------------------------------------------------------------
      - name: Configure swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl -w vm.swappiness=10
          echo "Swap total : $(free -h | awk '/^Swap:/ {print $2}')"

      # --------------------------------------------------------------------
      # 3. Install build dependencies
      # --------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git jq libelf-dev libssl-dev \
            python3 python3-requests unzip xz-utils zstd ccache lz4 \
            rsync dwarves make libdw-dev pkg-config device-tree-compiler

      # --------------------------------------------------------------------
      # 4. Restore / download FoxeClang
      # --------------------------------------------------------------------
      - name: Restore FoxeClang cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: FoxeClang-18.1.8-20260916

      - name: Download and extract FoxeClang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"
          curl -fSL --retry 3 -o foxe-clang.tar.zst \
            "https://github.com/FoxMiko-Labs/FoxeClang/releases/download/v18.1.8-20260916/FoxeClang-18.1.8-20260916.tar.zst"
          tar --use-compress-program=zstd -xf foxe-clang.tar.zst \
            -C "$CLANG_DIR" --strip-components=1
          rm -f foxe-clang.tar.zst

      # --------------------------------------------------------------------
      # 5. Restore / download FoxGCC ARM32
      # --------------------------------------------------------------------
      - name: Restore FoxGCC ARM32 cache
        id: cache-gcc32
        uses: actions/cache@v4
        with:
          path: ${{ env.GCC32_DIR }}
          key: fox-gcc32-v17.0-20260822

      - name: Download and extract FoxGCC ARM32
        if: steps.cache-gcc32.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GCC32_DIR"
          curl -fSL --retry 3 -o fox-gcc32.tar.zst \
            "https://github.com/FoxMiko-Labs/Fox-GCC/releases/download/v17.0-20260822/FoxGCC-17-arm-20260822.tar.zst"
          tar --use-compress-program=zstd -xf fox-gcc32.tar.zst \
            -C "$GCC32_DIR" --strip-components=1
          rm -f fox-gcc32.tar.zst

      # --------------------------------------------------------------------
      # 6. Validate toolchains
      # --------------------------------------------------------------------
      - name: Validate toolchains
        run: |
          set -e
          if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
            echo "::error::clang not found at $CLANG_DIR/bin/clang"
            exit 1
          fi
          CLANG_VERSION="$("$CLANG_DIR/bin/clang" --version | head -n1)"
          echo "Clang  : ${CLANG_VERSION}"
          echo "CLANG_VERSION=${CLANG_VERSION}" >> "$GITHUB_ENV"

          GCC32_BIN=$(find "$GCC32_DIR" -name "arm-eabi-gcc" -type f | head -1)
          if [[ -z "$GCC32_BIN" ]]; then
            echo "::warning::arm-eabi-gcc not found in $GCC32_DIR"
          else
            echo "GCC32  : $GCC32_BIN"
          fi

      # --------------------------------------------------------------------
      # 7. Restore and configure ccache
      # --------------------------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-surya-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-surya-${{ matrix.variant }}-
            ccache-surya-
            ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats

      # --------------------------------------------------------------------
      # 8. Resolve metadata
      # --------------------------------------------------------------------
      - name: Resolve metadata
        id: meta
        run: |
          DATE_TAG=$(TZ=Asia/Jakarta date +%d%m%Y)
          SHORT_SHA=$(git -C "$KERNEL_DIR" rev-parse --short=7 HEAD)

          if [[ "$ENABLE_KERNELSU" == "true" ]]; then
            VARIANT_DISPLAY="KernelSU"
          else
            VARIANT_DISPLAY="Non-KSU"
          fi

          ZIP_NAME="${KERNEL_NAME}-${VARIANT_LABEL}-${DATE_TAG}.zip"

          echo "DATE_TAG=${DATE_TAG}"               >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}"             >> "$GITHUB_ENV"
          echo "VARIANT_DISPLAY=${VARIANT_DISPLAY}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}"               >> "$GITHUB_ENV"
          echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> "$GITHUB_ENV"

          echo "date_tag=${DATE_TAG}"   >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # 9. Build kernel
      # --------------------------------------------------------------------
      - name: Build kernel [${{ matrix.variant }}]
        run: |
          echo "Device    : $TARGET_DEVICE"
          echo "Defconfig : $DEFCONFIG"
          echo "Variant   : $VARIANT_DISPLAY"
          echo "CPU cores : $(nproc --all)"

          if [[ ! -f "$KERNEL_DIR/buildci.sh" ]]; then
            echo "::error::buildci.sh not found"
            ls -la "$KERNEL_DIR"
            exit 1
          fi

          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          chmod +x "$KERNEL_DIR/buildci.sh"
          cd "$KERNEL_DIR"
          bash buildci.sh
          echo "BUILD_END=$(date +%s)" >> "$GITHUB_ENV"

      # --------------------------------------------------------------------
      # 10. Verify kernel output
      # --------------------------------------------------------------------
      - name: Verify kernel output
        run: |
          IMAGE="$KERNEL_DIR/out/arch/arm64/boot/Image.gz"
          if [[ ! -f "$IMAGE" ]]; then
            echo "::error::Kernel image not found"
            exit 1
          fi
          echo "Kernel image : $(du -sh "$IMAGE" | cut -f1)"

      # --------------------------------------------------------------------
      # 11. Clone AnyKernel3
      # --------------------------------------------------------------------
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/Michikoextv2/AK3-Surya.git \
            -b snova "$AK3_DIR"

      # --------------------------------------------------------------------
      # 12. Package kernel ZIP
      # --------------------------------------------------------------------
      - name: Package kernel ZIP
        run: |
          for img in Image.gz dtb.img dtbo.img; do
            src="$KERNEL_DIR/out/arch/arm64/boot/$img"
            if [[ -f "$src" ]]; then
              cp "$src" "$AK3_DIR/kernels"
              echo "Copied : $img"
            else
              echo "Skip   : $img (not found)"
            fi
          done

          (
            cd "$AK3_DIR"
            zip -r9 "$ZIP_PATH" . \
              -x "*.git*" \
              -x "README.md" \
              -x "*.github*"
          )

          ZIP_SIZE=$(du -sh "$ZIP_PATH" | cut -f1)
          echo "ZIP_SIZE=${ZIP_SIZE}" >> "$GITHUB_ENV"

          BUILD_DURATION_SEC=$(( BUILD_END - BUILD_START ))
          BUILD_DURATION="${BUILD_DURATION_SEC}s"
          if (( BUILD_DURATION_SEC >= 60 )); then
            BUILD_DURATION="$(( BUILD_DURATION_SEC / 60 ))m $(( BUILD_DURATION_SEC % 60 ))s"
          fi
          echo "BUILD_DURATION=${BUILD_DURATION}" >> "$GITHUB_ENV"

          echo "Packaged : ${ZIP_NAME} (${ZIP_SIZE})"

      # --------------------------------------------------------------------
      # 13. Upload ZIP as artifact (dikonsumsi job release)
      # --------------------------------------------------------------------
      - name: Upload kernel ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 1

      # --------------------------------------------------------------------
      # 14. Show ccache stats
      # --------------------------------------------------------------------
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      # --------------------------------------------------------------------
      # 15. Edit pesan Telegram jika build gagal
      #     Hanya edit pesan yang sudah ada — tidak kirim pesan baru
      # --------------------------------------------------------------------
      - name: Notify build failed
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: "-1003641667794"
          MSG_ID: ${{ needs.notify-start.outputs.msg_id }}
        run: |
          if [[ -z "$MSG_ID" ]]; then exit 0; fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="❌ Supernova Kernel — Build Failed

Device  : POCO X3 NFC (surya/karna)
Variant : ${{ matrix.variant }}
Actions : ${RUN_URL}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "message_id=${MSG_ID}" \
            --data-urlencode "text=${TEXT}" \
            --max-time 30 > /dev/null

  # ============================================================================
  # JOB 2 — Buat satu GitHub Release setelah kedua variant selesai,
  #          lalu edit pesan Telegram dengan link release
  # ============================================================================
  release:
    name: Create Unified Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [notify-start, build]

    permissions:
      contents: write

    env:
      TG_CHAT_ID: "-1003641667794"
      TG_THREAD_ID: "7279"
      TARGET_DEVICE: "POCO X3 NFC (surya/karna)"
      DEFCONFIG: surya_defconfig
      KERNEL_NAME: Supernova

    steps:
      # --------------------------------------------------------------------
      # 1. Resolve metadata dari build job outputs
      # --------------------------------------------------------------------
      - name: Resolve release metadata
        run: |
          DATE_TAG="${{ needs.build.outputs.date_tag }}"
          SHORT_SHA="${{ needs.build.outputs.short_sha }}"

          RELEASE_TAG="${DATE_TAG}-${SHORT_SHA}"
          RELEASE_NAME="Supernova-${DATE_TAG}-${SHORT_SHA}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

          ZIP_NONKSU="${KERNEL_NAME}-NonKSU-${DATE_TAG}.zip"
          ZIP_KSU="${KERNEL_NAME}-KSU-${DATE_TAG}.zip"

          echo "DATE_TAG=${DATE_TAG}"           >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}"         >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}"     >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_NAME}"   >> "$GITHUB_ENV"
          echo "RELEASE_URL=${RELEASE_URL}"     >> "$GITHUB_ENV"
          echo "ZIP_NONKSU=${ZIP_NONKSU}"       >> "$GITHUB_ENV"
          echo "ZIP_KSU=${ZIP_KSU}"             >> "$GITHUB_ENV"

      # --------------------------------------------------------------------
      # 2. Download kedua ZIP
      # --------------------------------------------------------------------
      - name: Download NonKSU artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ZIP_NONKSU }}
          path: dist

      - name: Download KSU artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ZIP_KSU }}
          path: dist

      - name: List downloaded artifacts
        run: ls -lh dist/

      # --------------------------------------------------------------------
      # 3. Checkout kernel source untuk commit log
      # --------------------------------------------------------------------
      - name: Checkout kernel source for commit log
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GH_PAT }}@github.com" \
            > ~/.git-credentials
          git clone --depth=6 --no-checkout \
            https://github.com/FoxMiko-Labs/kernel_xiaomi_surya.git \
            kernel-log
          cd kernel-log
          git fetch origin rebase
          git checkout FETCH_HEAD

      # --------------------------------------------------------------------
      # 4. Generate release notes
      # --------------------------------------------------------------------
      - name: Generate release notes
        run: |
          NONKSU_SIZE=$(du -sh "dist/${ZIP_NONKSU}" | cut -f1)
          KSU_SIZE=$(du -sh "dist/${ZIP_KSU}" | cut -f1)

          COMMIT_LOG=$(git -C kernel-log log -5 \
            --pretty=format:"- \`%h\` %s (%an)" --no-merges)

          {
            echo "## Supernova-${DATE_TAG}-${SHORT_SHA}"
            echo ""
            echo "### Device"
            echo "- **Target:** ${TARGET_DEVICE}"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Variant   | File                   | Size          |"
            echo "|-----------|------------------------|---------------|"
            echo "| Non-KSU   | \`${ZIP_NONKSU}\`   | ${NONKSU_SIZE} |"
            echo "| KernelSU  | \`${ZIP_KSU}\`      | ${KSU_SIZE}    |"
            echo ""
            echo "### Last 5 Commits"
            echo ""
            echo "${COMMIT_LOG}"
            echo ""
            echo "### Build Info"
            echo ""
            echo "| Key       | Value                    |"
            echo "|-----------|--------------------------|"
            echo "| Branch    | \`lineage-24.0\`         |"
            echo "| Runner    | \`ubuntu-24.04\`         |"
            echo "| Clang     | FoxeClang v18.1.8        |"
            echo "| GCC ARM32 | FoxGCC v17.0-20260822    |"
            echo "| Defconfig | \`${DEFCONFIG}\`         |"
            echo ""
            echo "---"
            echo ""
            echo "### Supported KSU Manager (KSU variant only)"
            echo ""
            echo "Choose one of the following managers:"
            echo ""
            echo "| Manager        | Link                                                           |"
            echo "|----------------|----------------------------------------------------------------|"
            echo "| KSU Official   | [Telegram](https://t.me/KernelSU_group/3234)                   |"
            echo "| KernelSU-Next  | [Telegram](https://t.me/ksunext_ci)                            |"
            echo "| KowSU          | [Telegram](https://t.me/kowsu_build)                           |"
            echo "| MamboSU        | [Telegram](https://t.me/WebsArch)                              |"
            echo "| xxKSU          | [GitHub](https://github.com/backslashxx/KernelSU/releases)     |"
            echo "| BakaSU         | [Telegram](https://t.me/BakaSU_Grp/4)                          |"
            echo "| midoriSU       | [GitHub](https://github.com/midori01/KernelSU/releases)        |"
            echo "| FinaSU         | [Telegram](https://t.me/FinaSU)                                |"
            echo "| OriginSU       | [Telegram](https://t.me/OriginKSU)                             |"
            echo ""
            echo "---"
            echo "Built by [Michikoextv2](https://github.com/Michikoextv2)"
          } > release_notes.md

          echo "NONKSU_SIZE=${NONKSU_SIZE}" >> "$GITHUB_ENV"
          echo "KSU_SIZE=${KSU_SIZE}"       >> "$GITHUB_ENV"

      # --------------------------------------------------------------------
      # 5. Create unified GitHub Release
      # --------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_notes.md
          files: |
            dist/${{ env.ZIP_NONKSU }}
            dist/${{ env.ZIP_KSU }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------------
      # 6. Edit pesan awal Telegram → tampilkan link release
      #    Tidak kirim pesan baru — hanya update pesan yang sudah ada
      # --------------------------------------------------------------------
      - name: Update Telegram notification with release link
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          MSG_ID: ${{ needs.notify-start.outputs.msg_id }}
        run: |
          if [[ -z "$MSG_ID" ]]; then
            echo "No message ID to update, skipping."
            exit 0
          fi

          TEXT="✅ Supernova Kernel — Build Complete

Device    : ${TARGET_DEVICE}
Non-KSU   : ${NONKSU_SIZE}
KernelSU  : ${KSU_SIZE}
Release   : ${RELEASE_URL}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "message_id=${MSG_ID}" \
            --data-urlencode "text=${TEXT}" \
            --max-time 30 > /dev/null

          echo "Telegram message updated: ${MSG_ID}"
