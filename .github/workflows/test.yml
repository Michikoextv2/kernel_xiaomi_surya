# ==============================================================================
# Michiko Kernel - Automated Build Workflow
# Target    : Poco X3 NFC (surya/karna)
# Branch    : lineage-24.0
# Runner    : ubuntu-24.04
# Toolchain : FoxeClang v18.1.8 + FoxGCC ARM32 v17.0
# ==============================================================================

name: Supernova Kernel

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".github/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Kernel [${{ matrix.variant }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        variant: [NonKSU, KSU]

    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_HOST: xyz
      KBUILD_BUILD_USER: standalone
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_DIR: ${{ github.workspace }}/toolchain/clang
      GCC32_DIR: ${{ github.workspace }}/toolchain/gcc32
      AK3_DIR: ${{ github.workspace }}/AnyKernel3
      KERNEL_DIR: ${{ github.workspace }}/kernel-source
      KERNEL_NAME: Supernova
      TARGET_DEVICE: "POCO X3 NFC (surya/karna)"
      DEFCONFIG: surya_defconfig
      ENABLE_KERNELSU: ${{ matrix.variant == 'KSU' && 'true' || 'false' }}
      TG_CHAT_ID: "-1003641667794"
      TG_THREAD_ID: "7279"

    steps:
      # --------------------------------------------------------------------
      # 0. Inject GH_PAT
      # --------------------------------------------------------------------
      - name: Configure git credentials
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GH_PAT }}@github.com" \
            > ~/.git-credentials
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf \
            "https://github.com/"

      # --------------------------------------------------------------------
      # 1. Checkout kernel source
      # --------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: FoxMiko-Labs/kernel_xiaomi_surya
          ref: rebase
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 5
          path: kernel-source

      # --------------------------------------------------------------------
      # 1.5. Implant NoMount
      # --------------------------------------------------------------------
      - name: Implant NoMount
        run: |
          cd "$KERNEL_DIR"
          curl -fsSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

      - name: Notify — NoMount implanted
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          token     = os.environ["TG_BOT_TOKEN"]
          chat_id   = os.environ["TG_CHAT_ID"]
          thread_id = os.environ["TG_THREAD_ID"]
          variant   = os.environ["MATRIX_VARIANT"]
          run_url   = "https://github.com/{repo}/actions/runs/{run_id}".format(
              repo   = os.environ["GITHUB_REPOSITORY"],
              run_id = os.environ["GITHUB_RUN_ID"],
          )
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id"           : chat_id,
                  "message_thread_id" : thread_id,
                  "text"              : (
                      "[{variant}] Build started\n"
                      "NoMount: implanted\n"
                      "Actions: {url}"
                  ).format(variant=variant, url=run_url),
              },
              timeout=30,
          )
          PYEOF
        env:
          MATRIX_VARIANT: ${{ matrix.variant }}

      # --------------------------------------------------------------------
      # 1.6. Setup KernelSU
      # --------------------------------------------------------------------
      - name: Setup KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd "$KERNEL_DIR"
          curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main

      - name: Notify — KernelSU configured
        if: env.ENABLE_KERNELSU == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          token     = os.environ["TG_BOT_TOKEN"]
          chat_id   = os.environ["TG_CHAT_ID"]
          thread_id = os.environ["TG_THREAD_ID"]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id"           : chat_id,
                  "message_thread_id" : thread_id,
                  "text"              : "[KSU] KernelSU: configured",
              },
              timeout=30,
          )
          PYEOF

      # --------------------------------------------------------------------
      # 2. Configure swap
      # --------------------------------------------------------------------
      - name: Configure swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl -w vm.swappiness=10
          echo "Swap total : $(free -h | awk '/^Swap:/ {print $2}')"

      # --------------------------------------------------------------------
      # 3. Install build dependencies
      # --------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git jq libelf-dev libssl-dev \
            python3 python3-requests unzip xz-utils zstd ccache lz4 \
            rsync dwarves make libdw-dev pkg-config device-tree-compiler

      - name: Notify — dependencies installed
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          token     = os.environ["TG_BOT_TOKEN"]
          chat_id   = os.environ["TG_CHAT_ID"]
          thread_id = os.environ["TG_THREAD_ID"]
          variant   = os.environ["MATRIX_VARIANT"]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id"           : chat_id,
                  "message_thread_id" : thread_id,
                  "text"              : "[{variant}] Dependencies: installed".format(variant=variant),
              },
              timeout=30,
          )
          PYEOF
        env:
          MATRIX_VARIANT: ${{ matrix.variant }}

      # --------------------------------------------------------------------
      # 4. Restore FoxeClang cache
      # --------------------------------------------------------------------
      - name: Restore FoxeClang cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: FoxeClang-18.1.8-20260916

      - name: Download and extract FoxeClang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"
          curl -fSL --retry 3 -o foxe-clang.tar.zst \
            "https://github.com/FoxMiko-Labs/FoxeClang/releases/download/v18.1.8-20260916/FoxeClang-18.1.8-20260916.tar.zst"
          tar --use-compress-program=zstd -xf foxe-clang.tar.zst \
            -C "$CLANG_DIR" --strip-components=1
          rm -f foxe-clang.tar.zst

      # --------------------------------------------------------------------
      # 5. Restore FoxGCC ARM32 cache
      # --------------------------------------------------------------------
      - name: Restore FoxGCC ARM32 cache
        id: cache-gcc32
        uses: actions/cache@v4
        with:
          path: ${{ env.GCC32_DIR }}
          key: fox-gcc32-v17.0-20260822

      - name: Download and extract FoxGCC ARM32
        if: steps.cache-gcc32.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GCC32_DIR"
          curl -fSL --retry 3 -o fox-gcc32.tar.zst \
            "https://github.com/FoxMiko-Labs/Fox-GCC/releases/download/v17.0-20260822/FoxGCC-17-arm-20260822.tar.zst"
          tar --use-compress-program=zstd -xf fox-gcc32.tar.zst \
            -C "$GCC32_DIR" --strip-components=1
          rm -f fox-gcc32.tar.zst

      # --------------------------------------------------------------------
      # 6. Validate toolchains
      # --------------------------------------------------------------------
      - name: Validate toolchains
        run: |
          set -e
          if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
            echo "::error::clang not found at $CLANG_DIR/bin/clang"
            exit 1
          fi
          echo "Clang  : $("$CLANG_DIR/bin/clang" --version | head -n1)"

          GCC32_BIN=$(find "$GCC32_DIR" -name "arm-eabi-gcc" -type f | head -1)
          if [[ -z "$GCC32_BIN" ]]; then
            echo "::warning::arm-eabi-gcc not found in $GCC32_DIR"
          else
            echo "GCC32  : $GCC32_BIN"
          fi

      - name: Notify — toolchains ready
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess, requests
          token     = os.environ["TG_BOT_TOKEN"]
          chat_id   = os.environ["TG_CHAT_ID"]
          thread_id = os.environ["TG_THREAD_ID"]
          variant   = os.environ["MATRIX_VARIANT"]
          clang_dir = os.environ["CLANG_DIR"]
          clang_ver = subprocess.check_output(
              [f"{clang_dir}/bin/clang", "--version"],
              text=True,
          ).splitlines()[0]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id"           : chat_id,
                  "message_thread_id" : thread_id,
                  "text"              : (
                      "[{variant}] Toolchains: ready\n"
                      "Clang: {clang}"
                  ).format(variant=variant, clang=clang_ver),
              },
              timeout=30,
          )
          PYEOF
        env:
          MATRIX_VARIANT: ${{ matrix.variant }}

      # --------------------------------------------------------------------
      # 7. Restore and configure ccache
      # --------------------------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-surya-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-surya-${{ matrix.variant }}-
            ccache-surya-
            ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats

      # --------------------------------------------------------------------
      # 8. Resolve release tag and variant metadata
      # --------------------------------------------------------------------
      - name: Resolve release tag
        run: |
          DATE_TAG=$(TZ=Asia/Jakarta date +%d%m%Y)
          SHORT_SHA=$(git -C "$KERNEL_DIR" rev-parse --short=7 HEAD)

          if [[ "$ENABLE_KERNELSU" == "true" ]]; then
            VARIANT_LABEL="KSU"
            VARIANT_DISPLAY="KernelSU"
          else
            VARIANT_LABEL="NonKSU"
            VARIANT_DISPLAY="Non-KSU"
          fi

          RELEASE_TAG="${DATE_TAG}-${SHORT_SHA}-${VARIANT_LABEL}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

          echo "DATE_TAG=${DATE_TAG}"               >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}"             >> "$GITHUB_ENV"
          echo "VARIANT_LABEL=${VARIANT_LABEL}"     >> "$GITHUB_ENV"
          echo "VARIANT_DISPLAY=${VARIANT_DISPLAY}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}"         >> "$GITHUB_ENV"
          echo "RELEASE_URL=${RELEASE_URL}"         >> "$GITHUB_ENV"

          echo "Date tag    : ${DATE_TAG}"
          echo "Short SHA   : ${SHORT_SHA}"
          echo "Variant     : ${VARIANT_DISPLAY}"
          echo "Release tag : ${RELEASE_TAG}"
          echo "Release URL : ${RELEASE_URL}"

      # --------------------------------------------------------------------
      # 9. Build kernel
      # --------------------------------------------------------------------
      - name: Notify — build started
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          token     = os.environ["TG_BOT_TOKEN"]
          chat_id   = os.environ["TG_CHAT_ID"]
          thread_id = os.environ["TG_THREAD_ID"]
          variant   = os.environ["VARIANT_DISPLAY"]
          device    = os.environ["TARGET_DEVICE"]
          defconfig = os.environ["DEFCONFIG"]
          run_url   = "https://github.com/{repo}/actions/runs/{run_id}".format(
              repo   = os.environ["GITHUB_REPOSITORY"],
              run_id = os.environ["GITHUB_RUN_ID"],
          )
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id"           : chat_id,
                  "message_thread_id" : thread_id,
                  "text"              : (
                      "Build in progress\n"
                      "\n"
                      "Device    : {device}\n"
                      "Variant   : {variant}\n"
                      "Defconfig : {defconfig}\n"
                      "Actions   : {url}"
                  ).format(
                      device    = device,
                      variant   = variant,
                      defconfig = defconfig,
                      url       = run_url,
                  ),
              },
              timeout=30,
          )
          PYEOF

      - name: Build kernel [${{ matrix.variant }}]
        run: |
          echo "Device    : $TARGET_DEVICE"
          echo "Defconfig : $DEFCONFIG"
          echo "Variant   : $VARIANT_DISPLAY"
          echo "CPU cores : $(nproc --all)"

          if [[ ! -f "$KERNEL_DIR/buildci.sh" ]]; then
            echo "::error::buildci.sh not found at $KERNEL_DIR"
            ls -la "$KERNEL_DIR"
            exit 1
          fi

          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

          chmod +x "$KERNEL_DIR/buildci.sh"
          cd "$KERNEL_DIR"
          bash buildci.sh

          echo "BUILD_END=$(date +%s)" >> "$GITHUB_ENV"

      # --------------------------------------------------------------------
      # 10. Verify kernel output
      # --------------------------------------------------------------------
      - name: Verify kernel output
        run: |
          IMAGE="$KERNEL_DIR/out/arch/arm64/boot/Image.gz"
          if [[ ! -f "$IMAGE" ]]; then
            echo "::error::Kernel image not found — build may have failed silently"
            exit 1
          fi
          echo "Kernel image : $(du -sh "$IMAGE" | cut -f1)"

      - name: Notify — kernel compiled
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          token     = os.environ["TG_BOT_TOKEN"]
          chat_id   = os.environ["TG_CHAT_ID"]
          thread_id = os.environ["TG_THREAD_ID"]
          variant   = os.environ["VARIANT_DISPLAY"]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id"           : chat_id,
                  "message_thread_id" : thread_id,
                  "text"              : "[{variant}] Kernel: compiled — packaging...".format(variant=variant),
              },
              timeout=30,
          )
          PYEOF

      # --------------------------------------------------------------------
      # 11. Clone AnyKernel3
      # --------------------------------------------------------------------
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/Michikoextv2/AK3-Surya.git \
            -b snova "$AK3_DIR"

      # --------------------------------------------------------------------
      # 12. Package kernel ZIP
      # --------------------------------------------------------------------
      - name: Package kernel ZIP
        run: |
          ZIP_NAME="${KERNEL_NAME}-${VARIANT_LABEL}-${DATE_TAG}.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"

          for img in Image.gz dtb.img dtbo.img; do
            src="$KERNEL_DIR/out/arch/arm64/boot/$img"
            if [[ -f "$src" ]]; then
              cp "$src" "$AK3_DIR/kernels"
              echo "Copied : $img"
            else
              echo "Skip   : $img (not found)"
            fi
          done

          (
            cd "$AK3_DIR"
            zip -r9 "$ZIP_PATH" . \
              -x "*.git*" \
              -x "README.md" \
              -x "*.github*"
          )

          ZIP_SIZE=$(du -sh "$ZIP_PATH" | cut -f1)
          echo "ZIP_SIZE=${ZIP_SIZE}" >> "$GITHUB_ENV"
          echo "Packaged : ${ZIP_NAME} (${ZIP_SIZE})"

      # --------------------------------------------------------------------
      # 13. Generate release notes
      # --------------------------------------------------------------------
      - name: Generate release notes
        run: |
          COMMIT_LOG=$(git -C "$KERNEL_DIR" log -5 \
            --pretty=format:"- \`%h\` %s (%an)" --no-merges)

          BUILD_DURATION_SEC=$(( BUILD_END - BUILD_START ))
          BUILD_DURATION="${BUILD_DURATION_SEC}s"
          if (( BUILD_DURATION_SEC >= 60 )); then
            BUILD_DURATION="$(( BUILD_DURATION_SEC / 60 ))m $(( BUILD_DURATION_SEC % 60 ))s"
          fi

          cat > "${GITHUB_WORKSPACE}/release_notes.md" << 'NOTES'
          ## Supernova-${VARIANT_LABEL}-${DATE_TAG}-${SHORT_SHA}

          ### Device
          - **Target:** ${TARGET_DEVICE}
          - **Variant:** ${VARIANT_DISPLAY}

          ### Last 5 Commits

          ${COMMIT_LOG}

          ### Build Info

          | Key       | Value                    |
          |-----------|--------------------------|
          | Branch    | `lineage-24.0`           |
          | Runner    | `ubuntu-24.04`           |
          | Clang     | FoxeClang v18.1.8        |
          | GCC ARM32 | FoxGCC v17.0-20260822    |
          | Defconfig | `${DEFCONFIG}`           |
          | Variant   | ${VARIANT_DISPLAY}       |
          | KernelSU  | ${ENABLE_KERNELSU}       |
          | Duration  | ${BUILD_DURATION}        |
          | Size      | ${ZIP_SIZE}              |

          ---

          ### Supported KSU Manager (KSU variant only)

          Choose one of the following managers:

          | Manager     | Link                                                              |
          |-------------|-------------------------------------------------------------------|
          | KSU Official | [Telegram](https://t.me/KernelSU_group/3234)                   |
          | KernelSU-Next | [Telegram](https://t.me/ksunext_ci)                           |
          | KowSU        | [Telegram](https://t.me/kowsu_build)                          |
          | MamboSU      | [Telegram](https://t.me/WebsArch)                             |
     
